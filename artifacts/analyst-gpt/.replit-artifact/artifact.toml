kind = "web"
previewPath = "/"
title = "AnalystGPT"
version = "1.0.0"
id = "artifacts/analyst-gpt"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21615

[services.development]
run = "pnpm --filter @workspace/analyst-gpt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/analyst-gpt", "run", "build" ]
publicDir = "artifacts/analyst-gpt/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21615"
BASE_PATH = "/"
